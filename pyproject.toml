# The one ruff and one mypy configuration (PROCESS.md section 4.5), and how pytest finds the code.
# A change to a limit in this file needs a decision of Achia's (PROMOTION.md, Level 3 list).

# The installed `ploni` command (build-plan.md Phase 0, Gate: "`ploni selftest` prints the model
# inventory and "offline OK"").
# Achia, 2026-11-20, asked "Which of the four may I build? (1) the `ploni` command, (2) the
# nightly full test run on GitHub, (3) the PR size limit, (4) the quick check before every
# commit. You can pick several.", answered "Why not all of them"; asked "I read "Why not all of
# them" as: yes, build all four (the ploni command, the full test run, the PR size limit, the
# check before commit). Is that right?", he chose "Yes, all four (Recommended)".
# The option for this part, "1. The ploni command", read: "Type `ploni selftest` instead of
# `python -m ploni selftest`. One line in the protected settings file, plus the standard install
# tool setuptools, pinned."
# The option said one line; the lines below are that line and what it needs, each only narrowing.
# Install, so that the build tool too is the hashed one of requirements-dev.txt:
#   python -m pip install --require-hashes -r requirements-dev.txt
#   python -m pip install --no-build-isolation --no-deps -e .
[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "ploni"
version = "0.0.0"
# build-plan.md Phase 0: Python 3.13 (Achia, 2026-11-13).
requires-python = ">=3.13"
# None: ploni/ uses the standard library only, as requirements.txt says.
dependencies = []

[project.scripts]
ploni = "ploni.__main__:main"

[tool.setuptools.packages.find]
# The product only: not tests/, scripts/, eval/ or experiments/.
include = ["ploni", "ploni.*"]

[tool.ruff]
# build-plan.md Phase 0: Python 3.13 (Achia, 2026-11-13).
target-version = "py313"
# Vendored third-party code is pinned byte for byte and is outside both tools (section 4.5).
extend-exclude = ["experiments/*/vendored", "models"]

[tool.ruff.lint]
select = [
    "F",       # unused imports and names, undefined names
    "B",       # likely bugs
    "BLE",     # errors caught blindly
    "S",       # unsafe calls; S110 and S112 are errors caught and dropped
    "E722",    # bare except
    "C901",    # complexity, the hard limit of section 4.1
    "PLR0915", # statements, the hard limit of section 4.1
    "ERA001",  # commented-out code
    "T201",    # print, under ploni/ only (see per-file-ignores)
    "TID251",  # banned imports, anywhere
    "TID253",  # banned module-level imports, under ploni/ only (see per-file-ignores)
    "RUF100",  # a noqa that no longer suppresses anything
]

[tool.ruff.lint.mccabe]
# PROCESS.md section 4.1, the hard limit: complexity over 10 is split.
max-complexity = 10

[tool.ruff.lint.pylint]
# PROCESS.md section 4.1, the hard limit: over 50 statements is split.
max-statements = 50

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# CLAUDE.md, Hard constraints: never use PyMuPDF, it is AGPL. Both of its import names.
"fitz".msg = "PyMuPDF is AGPL and is never used (CLAUDE.md, Hard constraints)."
"pymupdf".msg = "PyMuPDF is AGPL and is never used (CLAUDE.md, Hard constraints)."

[tool.ruff.lint.flake8-tidy-imports]
# CLAUDE.md, Hard constraints: no networking imports anywhere under ploni/.
# shortcut: this rule sees only a plain import line at the top level of a module, not one under
# try, if, a class or a function, and only the names listed; the T8 test of issue #19 scans every import.
banned-module-level-imports = [
    "aiohttp",
    "ftplib",
    "http",
    "httpx",
    "imaplib",
    "poplib",
    "requests",
    "smtplib",
    "socket",
    "socketserver",
    "ssl",
    "telnetlib",
    "urllib",
    "urllib3",
    "websockets",
    "xmlrpc",
]

[tool.ruff.lint.per-file-ignores]
# print and networking imports are banned under ploni/ only.
"!ploni/**" = ["T201", "TID253"]
# pytest tests assert.
"tests/**" = ["S101"]
"experiments/*/tests/**" = ["S101"]

[tool.pytest.ini_options]
# Tests import the code from the repository root, however pytest is started.
pythonpath = ["."]
# Two tiers may hold a test file of the same name (test_<module>.py in t1 and in t4).
addopts = ["--import-mode=importlib"]

[tool.mypy]
# PROCESS.md section 4.5: strict, on ploni/ only. Until that folder exists, the mypy step of
# scripts/check.py prints that it was skipped.
files = ["ploni"]
python_version = "3.13"
strict = true
