# The changed-paths check of issue #78: a PR that changes a .py file changes neither
# eval/baselines.json nor a CI workflow (PROMOTION.md section 5.1). A workflow of its own,
# on pull requests only, as Achia chose on 2026-11-19 ("New workflow file (Recommended)").
# It came in a PR of its own, with no .py file, because the check forbids the two together.
name: changed-paths

on:
  pull_request:
    # edited: a PR whose base branch is changed is judged again against the new base.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  changed-paths:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout is GitHub's merge of the PR into its base. Its first parent is the
          # base, so HEAD^1...HEAD is what the PR changes; depth 2 fetches that parent.
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The version of the fast workflow (build-plan.md Phase 0: Python 3.13).
          python-version: "3.13.5"
      - run: python scripts/check_changed_paths.py HEAD^1 HEAD
