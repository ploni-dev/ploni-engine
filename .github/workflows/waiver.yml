# The waiver check of issue #78: a waiver a PR cites exists in docs/WAIVERS.md, has not expired,
# and covers every file the PR changes (PROMOTION.md sections 8.4 and 8.5). A workflow of its
# own, on pull requests only, as Achia chose on 2026-11-19 ("New workflow file (Recommended)").
# It came in a PR of its own, with no .py file, because the changed-paths check forbids the two
# together. A PR that edits this file is judged by its own edited copy; against that, only the
# review and CLAUDE.md stand.
name: waiver

on:
  pull_request:
    # edited: a citation added to the body, or a new base, is judged again.
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  waiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout is GitHub's merge of the PR into its base. Its first parent is the
          # base, so HEAD^1...HEAD is what the PR changes, and HEAD^1 holds the waivers file
          # the check reads; depth 2 fetches that parent.
          fetch-depth: 2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The version of the fast workflow (build-plan.md Phase 0: Python 3.13).
          python-version: "3.13.5"
      - run: python -m scripts.check_waiver HEAD^1 HEAD
        env:
          # The body reaches the script only through the environment, never inside a shell command.
          PR_BODY: ${{ github.event.pull_request.body }}
