# The PR-body check of issue #21: the orientation block and the Ponytail review, both filled.
# A workflow of its own, as Achia chose on 2026-11-19 ("New workflow file"). It runs again when
# the body is edited. The body reaches the script only through the environment, never inside
# a shell command, so that no text in a PR body can run as code.
name: pr-body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-body:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The version of the fast workflow (build-plan.md Phase 0: Python 3.13).
          python-version: "3.13.5"
      - run: python scripts/check_pr_body.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
