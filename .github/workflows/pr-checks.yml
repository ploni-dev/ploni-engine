# The small checks of a PR in one job (issue #209). Achia, 2026-11-24, "Yes, prepare it locally
# (Recommended)", to cutting the Actions minutes; 2026-11-25, "Yes, add it (Recommended)", with
# these lines shown to him; 2026-11-24, "Go with your recommendation": the reviewed-commit check
# of issue #176 runs here as a step and has no workflow of its own.
# Each step is the command of a workflow that runs today (changed-paths, pr-size, pr-body, ratchet,
# waiver, commit-order), and the last is scripts/check_reviewed_commit.py, which ran on no PR
# before. One job starts one machine where six did; a job is billed in whole minutes.
# The checkout is GitHub's merge of the PR into its base, with all its history: the first five
# steps read HEAD^1...HEAD and need two commits, the last two read every commit of the PR
# (base HEAD^1, the PR's head HEAD^2). Main is checked out a second time under main-copy/, and the
# last two steps run main's copies of their scripts (PYTHONPATH there, `python -P`, so the PR's
# folder is not put on the import path): the PR's files are read only as git data, and no module
# the PR plants can run (as commit-order.yml; the review of #195, finding 1). Dry runs on the
# laptop of 2026-11-24, on #209: the seven steps pass and refuse as the six jobs and the script
# run by hand do, and a planted copy does not run. Nothing is installed: the scripts need the
# standard library only.
# The PR's body reaches the scripts only through the environment, never inside a shell command,
# so that no text in a PR body can run as code (as pr-body.yml).
# `if: ${{ !cancelled() }}` on each check: every check runs and reports even when an earlier one
# failed, and the job is red when any step is. The failed rule is in the job's log. A refusal of
# the last two steps says HEAD^1 where it means main, and HEAD^1..HEAD^2 for the PR's commits.
# Known limits:
# - GitHub runs the PR's own copy of this file on a pull request, so a PR with no .py file that
#   edits it switches it off, every check green; only the review stands against it, until this
#   file's pin (the next PR), which a PR can only change together with a .py file.
# - The first five steps run the PR's own copies of their scripts, as their workflows do today.
# - Until the guard patch that names pr-checks, the merge gate does not require this check
#   (PENDING_CHECKS in tests/t1_unit/test_guard.py); the six workflows it gathers run beside it
#   until they are removed, each step asked of Achia on its own.
# - Not measured before this file ran on GitHub: `!cancelled()` on a step after a failed one, the
#   second checkout under a path, and that the job stays under one billed minute.
name: pr-checks

on:
  pull_request:
    # edited: a body that was edited, or a new base, is judged again (as the six workflows).
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-checks:
    runs-on: ubuntu-24.04
    # The seven scripts took under 3 s together on the laptop; commit-order's job took 17 to 23 s
    # on GitHub (#198). Room for a long PR's history.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # commit-order and reviewed-commit read every commit of the PR, not the last one only.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main-copy
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # build-plan.md Phase 0: Python 3.13; the laptop runs 3.13.5.
          python-version: "3.13.5"
      - if: ${{ !cancelled() }}
        run: python scripts/check_changed_paths.py HEAD^1 HEAD
      - if: ${{ !cancelled() }}
        run: python -m scripts.check_pr_size HEAD^1 HEAD
      - if: ${{ !cancelled() }}
        run: python scripts/check_pr_body.py
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - if: ${{ !cancelled() }}
        run: python -m scripts.check_ratchet HEAD^1 HEAD
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - if: ${{ !cancelled() }}
        run: python -m scripts.check_waiver HEAD^1 HEAD
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
      - if: ${{ !cancelled() }}
        env:
          PYTHONPATH: ${{ github.workspace }}/main-copy
        run: python -P -m scripts.check_commit_order HEAD^1 HEAD^2
      - if: ${{ !cancelled() }}
        env:
          PYTHONPATH: ${{ github.workspace }}/main-copy
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python -P -m scripts.check_reviewed_commit HEAD^1 HEAD^2
