# The fast suite, on every push and every PR, to any base branch (PROCESS.md section 5.1).
# The merge gate reads the check this job reports (PROMOTION.md section 11).
name: fast

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fast-suite:
    runs-on: ubuntu-24.04
    # PROCESS.md section 5.1: the fast suite runs in under five minutes.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # build-plan.md Phase 0: Python 3.13; the laptop runs 3.13.5.
          python-version: "3.13.5"
          # The pip that checks the hashes is pinned too; 25.1.1 is the laptop's.
          pip-version: "25.1.1"
      - run: python -m pip install --require-hashes -r requirements-dev.txt
      - run: true
